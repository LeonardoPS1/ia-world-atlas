name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration:
    name: PostgreSQL + PostGIS integration
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: aiworldatlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d aiworldatlas_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://atlas:atlas@127.0.0.1:5432/aiworldatlas_test
      TEST_DATABASE_URL: postgres://atlas:atlas@127.0.0.1:5432/aiworldatlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Wait for PostGIS to be ready
        run: |
          for i in $(seq 1 30); do
            if psql -h localhost -U atlas -d aiworldatlas_test -c "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test
        env:
          CI: 'true'
      - name: Fail if the integration suite was skipped
        run: |
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "TEST_DATABASE_URL is not set, so the integration suite did not run" >&2
            exit 1
          fi

  e2e:
    name: Playwright end to end
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API server
        run: |
          cd apps/api
          ATLAS_REPOS=memory node --experimental-strip-types src/server.ts &
          sleep 5
          curl -f http://localhost:8787/api/health
      - name: Start Web server
        run: |
          cd apps/web
          VITE_API_BASE_URL=http://localhost:8787/api VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }} npm run build
          npx serve dist -l 5173 -s &
          sleep 5
          curl -f http://localhost:5173
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            vite_mapbox_token=${{ secrets.VITE_MAPBOX_TOKEN }}
      - name: Boot the stack and probe it
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/stats | tee /dev/stderr | grep -q '"projects":5'
          docker compose down -v