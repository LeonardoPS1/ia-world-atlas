services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ai-world-atlas-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiworldatlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports: ["5432:5432"]
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
      - ./apps/api/sql:/docker-entrypoint-initdb.d:ro
volumes:
  atlas_pgdata:
